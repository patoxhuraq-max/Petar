<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petar Payment</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background: url('https://i.postimg.cc/TYHpmV8t/line-oa-chat-260812-061518.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #b4b4b4;
            min-height: 100vh;
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden;
        }
        
        @keyframes float-up-down {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }
        @keyframes float-left-right {
            0%, 100% { transform: translateX(0px) rotate(0deg); }
            50% { transform: translateX(15px) rotate(-10deg); }
        }
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }

        @keyframes dash-animation {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -24; }
        }
        .animate-dash {
            animation: dash-animation 1s linear infinite;
        }

        .anim-float-1 { animation: float-up-down 4s ease-in-out infinite; }
        .anim-float-2 { animation: float-up-down 5s ease-in-out infinite 1.5s; }
        .anim-float-3 { animation: float-left-right 6s ease-in-out infinite; }
        .anim-float-4 { animation: float-left-right 4.5s ease-in-out infinite 2s; }
        .anim-pulse { animation: pulse-soft 3s ease-in-out infinite; }
        .anim-spin { animation: spin-slow 8s linear infinite; }

        .glass-card {
            background: rgba(27, 27, 27, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(130, 130, 130, 0.15);
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.2), 
                        inset 0 2px 10px rgba(180, 180, 180, 0.03);
        }

        .virtual-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .virtual-card:active {
            transform: scale(0.98);
        }

        .spider-element {
            position: fixed;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 99999;
            mix-blend-mode: multiply; 
        }

        .cobweb {
            width: 160px;
            animation: popAndFadeCobweb 1.5s ease-out 0s forwards;
        }

        .spider {
            width: 75px;
            animation: popAndFadeSpider 1.5s ease-out 0.05s forwards;
        }

        @keyframes popAndFadeCobweb {
            0% {
                transform: translate(-50%, -50%) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            30% {
                transform: translate(-50%, -50%) rotate(20deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) rotate(45deg) scale(1);
                opacity: 0;
            }
        }

        @keyframes popAndFadeSpider {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }
            30% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="flex flex-col items-center py-6 px-4 text-[#b4b4b4] relative">

    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-[#1b1b1b]/95 backdrop-blur-sm text-[#b4b4b4] px-6 py-3 rounded-full shadow-xl transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-[999999] flex items-center gap-2 font-medium text-sm border border-[#575757]">
        คัดลอกเลขบัญชีเรียบร้อย !
    </div>

    <div class="max-w-[420px] w-full relative z-10 space-y-4 pb-10">
        
        <div class="text-center pt-1 pb-1 relative">
            <h1 class="text-2xl font-bold tracking-tight text-[#b4b4b4]">Petar</h1>
            <p class="text-sm font-medium text-[#727272] mt-0.5">how 2 pay Petar</p>
        </div>

        <div class="glass-card rounded-[40px] p-3 relative z-10">
            <div class="relative p-2 rounded-[36px] z-10">
                <div class="rounded-[28px] overflow-hidden relative shadow-sm border-[4px] border-[#292929]/50">
                    <img src="https://i.postimg.cc/kGSRgDGn/IMG-2629.jpg" alt="บัญชี Petar" class="w-full h-auto object-cover opacity-90">
                </div>
            </div>

            <div class="p-4 pt-6 space-y-5">
                <div class="text-center space-y-3">
                    <p class="text-[15px] font-medium leading-relaxed text-[#b4b4b4]">
                        เลขบัญชีตามนี้เลยค้าบ<br>
                        ชื่อบัญชี <span class="text-[#b4b4b4] font-bold bg-[#1b1b1b]/30 px-2.5 py-0.5 rounded-lg border border-[#404040]/50">Supatcha S.</span> เท่านั้นคับ!!
                    </p>
                </div>

                <div class="space-y-4">
                    <div class="virtual-card relative bg-gradient-to-br from-[#404040]/35 to-[#292929]/35 backdrop-blur-md rounded-[24px] p-5 shadow-lg cursor-pointer border border-[#575757]/30" onclick="copyText('212-1-41844-7', this, 'kbank')">
                        <div class="relative z-10 flex flex-col gap-4">
                            <div class="flex justify-between items-center">
                                <span class="text-white font-bold text-sm">KBank</span>
                                <button class="kbank-btn bg-[#1b1b1b]/30 text-[#b4b4b4] text-[12px] font-bold px-4 py-2 rounded-full border border-[#575757]/50 pointer-events-none">คัดลอก</button>
                            </div>
                            <div>
                                <div class="text-[#b4b4b4]/90 text-[11px] mb-1">กสิกรไทย</div>
                                <div class="text-white font-bold text-[22px] tracking-widest">212-1-41844-7</div>
                            </div>
                        </div>
                    </div>

                    <div class="virtual-card relative bg-gradient-to-br from-[#575757]/35 to-[#404040]/35 backdrop-blur-md rounded-[24px] p-5 shadow-lg cursor-pointer border border-[#727272]/30" onclick="copyText('0931982812', this, 'true')">
                        <div class="relative z-10 flex flex-col gap-4">
                            <div class="flex justify-between items-center">
                                <span class="text-white font-bold text-sm">TrueMoney</span>
                                <button class="true-btn bg-[#1b1b1b]/30 text-[#b4b4b4] text-[12px] font-bold px-4 py-2 rounded-full border border-[#575757]/50 pointer-events-none">คัดลอก</button>
                            </div>
                            <div>
                                <div class="text-white/90 text-[11px] mb-1">ทรูมันนี่</div>
                                <div class="text-white font-bold text-[22px] tracking-widest">0931982812</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function spawnSpider(x, y) {
            const cobwebElement = document.createElement('img');
            cobwebElement.src = 'https://i.postimg.cc/JnVGdMKp/mi-m-ch-x-34-20260812073726.png'; 
            cobwebElement.className = 'spider-element cobweb';
            cobwebElement.style.left = `${x}px`;
            cobwebElement.style.top = `${y}px`;

            const spiderElement = document.createElement('img');
            spiderElement.src = 'https://i.postimg.cc/DZk8Yn55/mi-m-ch-x-32-20260812073654.png'; 
            spiderElement.className = 'spider-element spider';
            spiderElement.style.left = `${x}px`;
            spiderElement.style.top = `${y}px`;

            document.body.appendChild(cobwebElement);
            document.body.appendChild(spiderElement);

            setTimeout(() => {
                cobwebElement.remove();
                spiderElement.remove();
            }, 1500);
        }

        // ดักจับการคลิกเมาส์บนหน้าจอ
        document.addEventListener('click', function(event) {
            if (event.target.closest('button')) return;
            spawnSpider(event.clientX, event.clientY);
        });

        // ดักจับการสัมผัสหน้าจอบนมือถือ
        document.addEventListener('touchend', function(event) {
            if (event.target.closest('button')) return;
            if (event.changedTouches.length > 0) {
                const touch = event.changedTouches[0];
                spawnSpider(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        // ฟังก์ชันคัดลอกข้อความ
        function copyText(text, containerElement, type) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                document.execCommand('copy');
                showToast();

                const buttonElement = containerElement.querySelector(type === 'kbank' ? '.kbank-btn' : '.true-btn');
                const originalHtml = buttonElement.innerHTML;
                
                buttonElement.innerHTML = 'สำเร็จ';
                buttonElement.classList.replace('bg-[#1b1b1b]/30', 'bg-[#404040]');
                buttonElement.classList.replace('text-[#b4b4b4]', 'text-white');
                
                setTimeout(() => {
                    buttonElement.innerHTML = originalHtml;
                    buttonElement.classList.replace('bg-[#404040]', 'bg-[#1b1b1b]/30');
                    buttonElement.classList.replace('text-white', 'text-[#b4b4b4]');
                }, 2000);

            } catch (err) {
                console.error('ไม่สามารถคัดลอกได้:', err);
            }

            document.body.removeChild(textArea);
        }

        // ฟังก์ชันแสดงแจ้งเตือน Toast
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2500);
        }
    </script>
</body>
</html>
