<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider Click Effect</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #f0f0f0;
            cursor: crosshair;
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .spider-element {
            position: fixed;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 99999;
        }

        .cobweb {
            width: 250px; /* ปรับขนาดใยให้สมดุล */
            animation: popAndFade 2s ease-out forwards;
        }

        .spider {
            width: 100px; /* ปรับขนาดแมงมุมให้สมดุล */
            animation: popAndFade 2s ease-out 0.1s forwards;
        }

        @keyframes popAndFade {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <script>
        function spawnSpider(x, y) {
            // สร้างใยแมงมุม
            const cobweb = document.createElement('img');
            cobweb.src = 'https://i.postimg.cc/JnVGdMKp/mi-m-ch-x-34-20260812073726.png';
            cobweb.className = 'spider-element cobweb';
            cobweb.style.left = `${x}px`;
            cobweb.style.top = `${y}px`;

            // สร้างแมงมุม
            const spider = document.createElement('img');
            spider.src = 'https://i.postimg.cc/DZk8Yn55/mi-m-ch-x-32-20260812073654.png';
            spider.className = 'spider-element spider';
            spider.style.left = `${x}px`;
            spider.style.top = `${y}px`;

            document.body.appendChild(cobweb);
            document.body.appendChild(spider);

            // ลบออกจากหน้าจอหลังจบแอนิเมชัน
            setTimeout(() => {
                cobweb.remove();
                spider.remove();
            }, 2000);
        }

        // รองรับการคลิกด้วยเมาส์ (คอมพิวเตอร์)
        document.addEventListener('click', function(event) {
            spawnSpider(event.clientX, event.clientY);
        });

        // รองรับการแตะหน้าจอ (มือถือ/แท็บเล็ต)
        document.addEventListener('touchend', function(event) {
            if (event.changedTouches.length > 0) {
                const touch = event.changedTouches[0];
                spawnSpider(touch.clientX, touch.clientY);
            }
        }, { passive: true });
    </script>

</body>
</html>
